# N64Recomp configuration for Conker's Bad Fur Day (US), our pipeline (v2).
# Adapted from CBFD-Recompiled's conker.toml (Copyright (c) 2026 Sean Ciaschi,
# MIT License -- see recomp/THIRD_PARTY_LICENSE): the stubs,
# instruction patches and hooks below are theirs; widescreen and frame
# interpolation hooks are at the end (ported 2026-09-28).

[input]
entrypoint = 0x80001000
elf_path = "conker.us.recomp.elf"
output_func_path = "out"
uses_mips3_float_mode = true

[patches]
# Low-level system code with TLB/cop0/cache instructions. None of it can run
# under the runtime, which provides its own threads, exceptions and memory.
stubs = [
    # Virtual-memory paging for .game (init_5AB0.s): the TLB-miss handler, its
    # page-in/eviction helpers, and TLB invalidation (func_100061F8).
    "func_10005C2C",
    "func_10005D20",
    "func_100060F0",
    "func_10006138",
    "func_100061F8",
    # Exception handling and thread dispatch (init_5AB0.s).
    "func_100071D0",
    "func_100071E0",
    "func_1000777C",
    "func_10007A38",
    "func_10007C74",
    "func_10007CC4",
    "func_10007DAC",
    "func_10007F70",
    # Debugger: dumps all 32 TLB entries.
    "func_16003650",
    # Unreferenced .game copy of a Controller Pak status routine; it calls SI
    # internals the runtime doesn't provide.
    "func_151EF504",
]

# Boot: recomp_entrypoint clears .bss and jumps to 0x80005AB0, the KSEG0 view
# of func_10005AB0, which writes TLB entry 0 and jumps to 0x10001050. Point the
# first jump at the .init address and drop the TLB write so both jumps resolve
# to recompiled functions.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80001024
value = 0x3C0A1000  # lui $t2, 0x1000 (was 0x8000)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005AB8
value = 0x00000000  # nop (was mtc0 $t0, PageMask)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005AC0
value = 0x00000000  # nop (was mtc0 $t0, EntryHi)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005AC8
value = 0x00000000  # nop (was mtc0 $t0, EntryLo0)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005AD4
value = 0x00000000  # nop (was mtc0 $t0, EntryLo1)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005ADC
value = 0x00000000  # nop (was mtc0 $t0, Index)

[[patches.instruction]]
func = "func_10005AB0"
vram = 0x10005AE4
value = 0x00000000  # nop (was tlbwi)

# func_10005B04 sets up the .game paging system: it clears Context, sets Wired,
# and allocates the page pool and its bitmap. Keep the allocations (other code
# uses that memory layout) and drop the cop0 writes.
[[patches.instruction]]
func = "func_10005B04"
vram = 0x10005B10
value = 0x00000000  # nop (was mtc0 $zero, Context)

[[patches.instruction]]
func = "func_10005B04"
vram = 0x10005B18
value = 0x00000000  # nop (was mtc0 $t0, Wired)

# func_10001050 (boot init) reads and writes the Status register to set CU1/FR;
# the runtime owns that state.
[[patches.instruction]]
func = "func_10001050"
vram = 0x10001084
value = 0x00000000  # nop (was jal __osGetSR)

[[patches.instruction]]
func = "func_10001050"
vram = 0x1000109C
value = 0x00000000  # nop (was jal __osSetSR)

# func_100052A0 is the pre-NMI thread: on reset it stops the game threads,
# reinitialises VI through libultra internals and stops rumble. The runtime
# owns VI.
[[patches.instruction]]
func = "func_100052A0"
vram = 0x10005328
value = 0x00000000  # nop (was jal __osViInit)

# ---------------------------------------------------------------------------
# Direct hardware and uncached (KSEG1) accesses. The runtime maps only KSEG0
# RDRAM, so these loads would fault. Each load becomes a nop plus a hook that
# does the read on the host (host/src/ultra_extras.cpp).
# ---------------------------------------------------------------------------

# func_100095A0 (audio thread) reads AI_LEN_REG directly: an inlined osAiGetLength.
# $v0 is overwritten by the next instruction, so the hook may use it.
[[patches.instruction]]
func = "func_100095A0"
vram = 0x100095D0
value = 0x00000000  # nop (was lw $v1, 4($t6): AI_LEN_REG)

[[patches.hook]]
func = "func_100095A0"
before_vram = 0x100095D0
text = "{ extern void osAiGetLength_recomp(uint8_t*, recomp_context*); osAiGetLength_recomp(rdram, ctx); ctx->r3 = ctx->r2; }"

# Music (CBFD-Recompiled V0.1.5, issue #66; host/src/libultra_extras.cpp). func_10008CE8 (start a
# song on a sequence player) busy-waits for the audio thread to stop the player, which on the N64
# preempts it; here the loop has to yield for the audio thread to run. A hook at the head of each of
# its two wait loops, before the n_alCSPGetState call.
[[patches.hook]]
func = "func_10008CE8"
before_vram = 0x10008D44
text = "{ extern void conker_spin_wait_pass(uint8_t*, recomp_context*); conker_spin_wait_pass(rdram, ctx); }"

[[patches.hook]]
func = "func_10008CE8"
before_vram = 0x10008D98
text = "{ extern void conker_spin_wait_pass(uint8_t*, recomp_context*); conker_spin_wait_pass(rdram, ctx); }"

# A song just started reads as stopped until the audio thread takes it up, and the music manager
# took such a player for free while it played on. So it reads as playing until then: marked when
# func_10008CE8 starts the song, the mark cleared when func_10008F24 stops the player, and
# func_1000853C (a player's state) answers "playing" meanwhile.
[[patches.hook]]
func = "func_10008CE8"
before_vram = 0x10008EC4
text = "{ extern void conker_song_started(uint8_t*, recomp_context*); conker_song_started(rdram, ctx); }"

[[patches.hook]]
func = "func_1000853C"
before_vram = 0x10008560
text = "{ extern void conker_song_state(uint8_t*, recomp_context*); conker_song_state(rdram, ctx); }"

[[patches.hook]]
func = "func_10008F24"
before_vram = 0x10008F24
text = "{ extern void conker_song_stopped(uint8_t*, recomp_context*); conker_song_stopped(rdram, ctx); }"

# func_1000480C: Rare's PIO copy from cartridge ROM (used by the ROM loader
# func_10004514). It polls PI_STATUS, then reads the cartridge word by word
# through (osRomBase | addr | 0xA0000000).
[[patches.instruction]]
func = "func_1000480C"
vram = 0x1000486C
value = 0x00001025  # move $v0, $zero (was lw $v0, 0($v1): PI_STATUS, never busy)

[[patches.instruction]]
func = "func_1000480C"
vram = 0x100048B4
value = 0x00000000  # nop (was lw $t8, 0($t7))

[[patches.hook]]
func = "func_1000480C"
before_vram = 0x100048B4
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r24 = conker_kseg1_read32(rdram, (uint32_t)ctx->r15); }"

[[patches.instruction]]
func = "func_1000480C"
vram = 0x100048E4
value = 0x00000000  # nop (was lw $t4, 0($t3))

[[patches.hook]]
func = "func_1000480C"
before_vram = 0x100048E4
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r12 = conker_kseg1_read32(rdram, (uint32_t)ctx->r11); }"

[[patches.instruction]]
func = "func_1000480C"
vram = 0x10004924
value = 0x00000000  # nop (was lw $t5, 0($t4))

[[patches.hook]]
func = "func_1000480C"
before_vram = 0x10004924
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r13 = conker_kseg1_read32(rdram, (uint32_t)ctx->r12); }"

[[patches.instruction]]
func = "func_1000480C"
vram = 0x10004958
value = 0x00000000  # nop (was lw $t2, 0($t9))

[[patches.hook]]
func = "func_1000480C"
before_vram = 0x10004958
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r10 = conker_kseg1_read32(rdram, (uint32_t)ctx->r25); }"

[[patches.instruction]]
func = "func_1000480C"
vram = 0x10004984
value = 0x00000000  # nop (was lw $t7, 0($t5))

[[patches.hook]]
func = "func_1000480C"
before_vram = 0x10004984
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r15 = conker_kseg1_read32(rdram, (uint32_t)ctx->r13); }"

# func_15001A08: an anti-piracy check. It reads ROM word 0xD24 through KSEG1 and,
# if that isn't 0x98CCE31A, doubles an allocation. Same PI_STATUS poll first.
[[patches.instruction]]
func = "func_15001A08"
vram = 0x15001A38
value = 0x00001025  # move $v0, $zero (was lw $v0, 0($v1): PI_STATUS)

[[patches.instruction]]
func = "func_15001A08"
vram = 0x15001A78
value = 0x00000000  # nop (was lw $t3, 0($t2))

[[patches.hook]]
func = "func_15001A08"
before_vram = 0x15001A78
text = "{ extern int32_t conker_kseg1_read32(uint8_t*, uint32_t); ctx->r11 = conker_kseg1_read32(rdram, (uint32_t)ctx->r10); }"

# 0x150A6B90 builds an uncached RDRAM pointer (0xA0000000 | addr) and stores
# through it with sd. Use the KSEG0 alias of the same memory instead. The
# instruction is in two overlapping functions.
[[patches.instruction]]
func = "func_150A6860"
vram = 0x150A6B90
value = 0x3C098000  # lui $t1, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_150A6A5C"
vram = 0x150A6B90
value = 0x3C098000  # lui $t1, 0x8000 (was 0xA000)

# ---------------------------------------------------------------------------
# Non-local exits in hand-written asm.
# ---------------------------------------------------------------------------

# func_150ADAF0 is a hand-written script interpreter. It saves its $sp in
# D_800D3858 on entry, and its abort (func_150AE280, called from func_1509F8xx
# inside a script callback) reloads that $sp and jumps to the interpreter's
# epilogue (func_150AE0AC): a longjmp out of the nested calls. Recompiled, the
# epilogue only returned from the innermost C call, and the interpreter went on
# with its caller's registers (a crash reading 0x000000BF in func_150ADBC4, in
# the Panther King cutscene after Hungover's opening). Do it with setjmp/longjmp
# (host/CMakeLists.txt force-includes setjmp.h; the buffer is in ultra_extras.cpp).
[[patches.hook]]
func = "func_150ADAF0"
before_vram = 0x150ADAFC
text = "{ extern jmp_buf conker_interpreter_exit; if (setjmp(conker_interpreter_exit)) { func_150AE0AC(rdram, ctx); return; } }"

[[patches.hook]]
func = "func_150AE280"
before_vram = 0x150AE290
text = "{ extern jmp_buf conker_interpreter_exit; ctx->r29 = ctx->r10; longjmp(conker_interpreter_exit, 1); }"

# The collision code's shared subroutine at 0x150AC1C4 returns with `jr $t0`,
# which prepare_elf.py turns into `jr $ra` because its callers (`jal`) pass their
# return point in $t0. func_150AC1B4 instead loads $t0 with 0x150AB6F0 and falls
# into it: a goto to 0x150AB6F0 once the subroutine is done. Recompiled, that
# path just returned, skipping the rest of func_150AB1F0 and its epilogue, so its
# caller came back with $sp 0x268 bytes short and a garbage $s0 (a crash in
# func_1512BB10 shortly after Hungover starts). Call the subroutine, then go on
# at 0x150AB6F0.
[[patches.hook]]
func = "func_150AC1B4"
before_vram = 0x150AC1C4
text = "{ func_150AC1C4(rdram, ctx); func_150AB6F0(rdram, ctx); return; }"

# func_150AC0F8 falls through func_150AC1B4 into the same code, so its body
# holds another copy of that path (a crash walking toward Birdy).
[[patches.hook]]
func = "func_150AC0F8"
before_vram = 0x150AC1C4
text = "{ func_150AC1C4(rdram, ctx); func_150AB6F0(rdram, ctx); return; }"

# ---------------------------------------------------------------------------
# libultra state that the runtime's replacements don't set up.
# ---------------------------------------------------------------------------

# libultra's osContInit creates __osEepromTimerQ (0x80042A78, one slot); the
# runtime's osContInit doesn't. Rare's EEPROM code (func_151DCFD8) paces its
# accesses with one-shot timers on that queue. Uncreated, the queue counts as
# full, no timer message ever arrives, and the game froze on a black screen at
# the first save (the start of Hungover, after the intro cutscene). Create it
# after func_15006234's first osContInit call, the game's only one at boot.
[[patches.hook]]
func = "func_15006234"
before_vram = 0x15006288
text = "{ extern void conker_create_eeprom_timer_queue(uint8_t*); conker_create_eeprom_timer_queue(rdram); }"

# func_150FB4C0 (hand-written, drawing small coloured rectangles, for example when
# leaving the mansion's hub) writes its display list through the uncached address
# (| 0x20000000), which isn't mapped here. Write it through the cached one: the
# same memory.
[[patches.instruction]]
func = "func_150FB4C0"
vram = 0x150FB654
value = 0x00000000  # nop (was or $a0, $a0, $t0: KSEG0 to KSEG1)

[[patches.instruction]]
func = "func_150FB4C0"
vram = 0x150FB8A8
value = 0x00000000  # nop (was xor $a0, $a0, $t0: back to KSEG0)

# Widescreen: screen-space sprites (bubbles, bees, sparkles) are culled to the 4:3
# screen and drawn with G_TEXRECT, which can't reach left of x = 0. Widen the cull
# bounds and emit the rectangle as RT64's extended one (host/src/widescreen.cpp).
# Widescreen: the camera's frustum, which the world and its objects are culled
# against, is built for the 4:3 view. Widen its left and right planes to the
# window (host/src/widescreen.cpp). $s0 is the camera until the return.
# Widescreen: the scale the level's culls compare view-space x with is set for
# the 4:3 view too. Widen it to the window (host/src/widescreen.cpp).
# Widescreen: the pause menu's blurred background, a saved copy of the 4:3 frame
# drawn as tiles, is stretched over the whole width (host/src/widescreen.cpp).
# Frame interpolation: each game object's drawing (func_1502CCFC) is wrapped in an
# RT64 matrix group naming the object, so RT64 pairs its matrices with the same
# object's last frame instead of guessing (host/src/interpolation.cpp).
# The same for a character's shadow (func_15186794), whose texture coordinates RT64
# interpolates from last frame's projection.
# Widescreen: the circle wipe (spawn, death, level changes) is redrawn with pieces
# that reach the window's edges (host/src/widescreen.cpp).

# ---------------------------------------------------------------------------
# Widescreen and frame-rate (interpolation) hooks, from CBFD-Recompiled (MIT);
# implemented in host/src/widescreen.cpp and host/src/interpolation.cpp.
# ---------------------------------------------------------------------------

# Widescreen: screen-space sprites (bubbles, bees, sparkles) are culled to the 4:3
# screen and drawn with G_TEXRECT, which can't reach left of x = 0. Widen the cull
# bounds and emit the rectangle as RT64's extended one (host/src/widescreen.cpp).
[[patches.hook]]
func = "func_15130A9C"
before_vram = 0x15130CEC
text = "{ extern void conker_widen_sprite_cull_left(uint8_t*, recomp_context*); conker_widen_sprite_cull_left(rdram, ctx); }"

[[patches.hook]]
func = "func_15130A9C"
before_vram = 0x15130D08
text = "{ extern void conker_widen_sprite_cull_right(uint8_t*, recomp_context*); conker_widen_sprite_cull_right(rdram, ctx); }"

[[patches.hook]]
func = "func_15130A9C"
before_vram = 0x15131168
text = "{ extern void conker_emit_sprite_texrect(uint8_t*, recomp_context*); conker_emit_sprite_texrect(rdram, ctx); goto L_15131360; }"

[[patches.hook]]
func = "func_15130A9C"
before_vram = 0x15130DA0
text = "{ extern void conker_enable_extended_gbi(uint8_t*, recomp_context*); conker_enable_extended_gbi(rdram, ctx); }"

# Widescreen: the camera's frustum, which the world and its objects are culled
# against, is built for the 4:3 view. Widen its left and right planes to the
# window (host/src/widescreen.cpp). $s0 is the camera until the return.
[[patches.hook]]
func = "func_1501B22C"
before_vram = 0x1501B308
text = "{ extern void conker_scene_widen_frustum(uint8_t*, recomp_context*); conker_scene_widen_frustum(rdram, ctx); }"

# Widescreen: the scale the level's culls compare view-space x with is set for
# the 4:3 view too. Widen it to the window (host/src/widescreen.cpp).
[[patches.hook]]
func = "func_1510B958"
before_vram = 0x1510B9C8
text = "{ extern void conker_scene_widen_cull_scale(uint8_t*, recomp_context*); conker_scene_widen_cull_scale(rdram, ctx); }"

# Widescreen: the pause menu's blurred background, a saved copy of the 4:3 frame
# drawn as tiles, is stretched over the whole width (host/src/widescreen.cpp).
[[patches.hook]]
func = "func_151D5E90"
before_vram = 0x151D5E94
text = "{ extern void conker_frame_copy_begin(uint8_t*, recomp_context*); conker_frame_copy_begin(rdram, ctx); }"

[[patches.hook]]
func = "func_151D5E90"
before_vram = 0x151D61A8
text = "{ extern void conker_frame_copy_end(uint8_t*, recomp_context*); conker_frame_copy_end(rdram, ctx); }"

[[patches.hook]]
func = "func_151D6418"
before_vram = 0x151D641C
text = "{ extern void conker_frame_copy_begin(uint8_t*, recomp_context*); conker_frame_copy_begin(rdram, ctx); }"

[[patches.hook]]
func = "func_151D6418"
before_vram = 0x151D66E8
text = "{ extern void conker_frame_copy_end(uint8_t*, recomp_context*); conker_frame_copy_end(rdram, ctx); }"

# Frame interpolation: each game object's drawing (func_1502CCFC) is wrapped in an
