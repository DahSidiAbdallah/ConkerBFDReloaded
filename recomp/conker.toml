[[patches.hook]]
func = "func_15186794"
before_vram = 0x15186798
text = "{ extern void conker_shadow_matrix_group_begin(uint8_t*, recomp_context*); conker_shadow_matrix_group_begin(rdram, ctx); }"

[[patches.hook]]
func = "func_15186794"
before_vram = 0x151872A8
text = "{ extern void conker_shadow_matrix_group_end(uint8_t*, recomp_context*); conker_shadow_matrix_group_end(rdram, ctx); }"

